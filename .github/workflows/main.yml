name: Inspect JRI database

'on':
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q JRI_LevelUP_supabase_connected_v3.zip -d extracted

      - name: Show screen code
        run: |
          echo "=== HOME SCREEN ==="
          cat extracted/lib/screens/home_screen.dart
          echo "=== OTHER SCREENS ==="
          find extracted/lib/screens -name '*.dart' -type f

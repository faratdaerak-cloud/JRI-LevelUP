name: Inspect JRI database

'on':
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q JRI_LevelUP_supabase_connected_v3.zip -d extracted

      - name: Show remaining screens
        run: |
          for f in extracted/lib/screens/goals_screen.dart extracted/lib/screens/diary_screen.dart extracted/lib/screens/progress_screen.dart extracted/lib/screens/profile_screen.dart extracted/lib/screens/ai_screen.dart; do
            echo "========== $f =========="
            cat "$f"
          done
